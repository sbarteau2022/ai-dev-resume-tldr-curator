name: CI

# A single static HTML page with one generated section: the reach block
# (reader-city map + the city/country figures beside it) is written from
# data/reader-cities.json by `npm run build`. Deploys are handled by
# Cloudflare Workers Builds outside of GitHub Actions. This workflow
# validates that a push/PR hasn't broken the page: that the reach section
# still matches its data source (check:reach — a page quoting a figure the
# data doesn't support fails here), HTML structure, inline JS syntax, and
# that the Worker's assets config still bundles cleanly (wrangler
# --dry-run, no credentials required/used).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
